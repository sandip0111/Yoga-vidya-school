          />

            One Week of Free Learning - <i>“Into the Roots of Yoga”</i>

          <div
            class="banner-subtitle-overlay"

          ></div>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="registration-container">
  <div class="card registration-card" id="register-form">
    <div class="p-4 pb-0">
      <p class="register-head">One week. Five sessions. Free access.</p>
      <p class="register-head mb-4">Recordings will also be available.</p>
      <p class="form-desc text-center">JOIN NOW: We are waiting for you!</p>
      <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
        <div class="mb-3 text-start">
          <label for="name" class="form-label">Name</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            class="form-control"
            [ngClass]="{
              'is-invalid': submitted && registrationForm.get('name')?.invalid,
            }"
          />
          <div
            *ngIf="submitted && registrationForm.get('name')?.invalid"
            class="text-danger"
          >
            Name is required.
          </div>
        </div>

        <div class="mb-3 text-start">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [ngClass]="{
              'is-invalid': submitted && registrationForm.get('email')?.invalid,
            }"
          />
          <div
            *ngIf="submitted && registrationForm.get('email')?.invalid"
            class="text-danger"
          >
            Please enter a valid email.
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2.5 mb-4">
          Join Now
        </button>
      </form>
    </div>
