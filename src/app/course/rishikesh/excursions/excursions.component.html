<!-- about.component.html -->

<section class="excursions-rishikesh-section py-5" [class.mysore-200-excursions]="slug == routeEnum.mysore200 || slug == '200-hours-yoga-teacher-training-in-mysore'" *ngIf="noContent">
  <div class="row text-center">
    <div class="col-md-12">
      <div>
        <img
          loading="lazy"
          alt="Not Loaded"
          [src]="s3Bucket.flower"
          class="flower-img"
        />
      </div>
      <h2>
        @if(slug == routeEnum.mysore200) {
          Excursions During Your 
        } @else {
          Excursions for 
        }
        <span>{{ exsData?.title }}</span>
      </h2>
      <small>{{ exsData?.desc }}</small>
    </div>
  </div>
  <div class="row" [class.excursion-row]="slug == routeEnum.mysore200">
    <div class="col-md-6 image" [class.excursion-image-col]="slug == routeEnum.mysore200">
      <div class="imageback">
        <img
          loading="lazy"
          src="{{ exsData?.row1?.img }}"
          class="img-fluid"
          alt="About Image"
        />
      </div>
    </div>
    <div class="col-md-6 d-flex align-items-center" [class.excursion-text-col]="slug == routeEnum.mysore200">
      <div class="excursion-content" [class.ps-lg-4]="slug == routeEnum.mysore200">
        <h3>
          <span>{{ exsData?.row1?.title }}</span>
        </h3>
        <p [innerHTML]="exsData?.row1?.desc"></p>
      </div>
    </div>
  </div>
  <div class="row mb-5" [class.excursion-row]="slug == routeEnum.mysore200">
    <div class="col-md-6 d-flex align-items-center" [class.excursion-text-col]="slug == routeEnum.mysore200">
      <div class="excursion-content" [class.pe-lg-4]="slug == routeEnum.mysore200">
        <h3>{{ exsData?.row2?.title }}</h3>
        <p [innerHTML]="exsData?.row2?.desc"></p>
      </div>
    </div>
    <div class="col-md-6 image" [class.excursion-image-col]="slug == routeEnum.mysore200">
      <div class="imageback">
        <img
          loading="lazy"
          src="{{ exsData?.row2?.img }}"
          class="img-fluid"
          alt="About Image"
        />
      </div>
    </div>
  </div>
  <div class="row" [class.excursion-row]="slug == routeEnum.mysore200">
    <div class="col-md-6 image" [class.excursion-image-col]="slug == routeEnum.mysore200">
      <div class="imageback">
        <img
          loading="lazy"
          src="{{ exsData?.row3?.img }}"
          class="img-fluid"
          alt="About Image"
        />
      </div>
    </div>
    <div class="col-md-6 d-flex align-items-center" [class.excursion-text-col]="slug == routeEnum.mysore200">
      <div class="excursion-content" [class.ps-lg-4]="slug == routeEnum.mysore200">
        <h3>
          <span>{{ exsData?.row3?.title }}</span>
        </h3>
        <p [innerHTML]="exsData?.row3?.desc"></p>
      </div>
    </div>
  </div>
</section>
