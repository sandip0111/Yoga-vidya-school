<div class="container text-center mt-4">
  <div class="card d-inline-block w-80" *ngIf="paidFlag == 'true'">
    <div class="card-body">
      <span class="fas fa-check-circle fa-5x text-success mb-4"></span>
      <p class="card-text">Thank you for your purchase! 🙏</p>
      <p class="card-text">We’ve sent you an email with all the information you need.</p>
      <p class="card-text">Please check your inbox and, just in case, your Promotions and Spam/Junk folders as well.</p>
      <p>
        <a
          *ngIf="sessionId || pranaArambhaRazorpayPaymentId"
          href="javascript:void(0)"
          class="btn btn-primary border-0"
          style="background: #f9751e"
          (click)="gotoAccount()"
          >Go to Home</a
        >
        <a
          *ngIf="
            onlinesessionId ||
            onlineLiveClassesSessionId ||
            pranicPurificationRazorPaySessionId ||
            pranicPurificationSessionId ||
            onlineClassRazorpayPaymentId ||
            is200TTC ||
            isRishikesh ||
            isRetreat ||
            isPersonalGuidance
          "
          href="javascript:void(0)"
          class="btn btn-primary border-0"
          style="background: #f9751e"
          (click)="gotoHome()"
          >Go to Home</a
        >
      </p>
    </div>
  </div>
</div>
