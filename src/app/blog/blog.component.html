<section class="breadcrumb_section">
  <div class="container">
    <div class="row">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item active" aria-current="page">Home</li>
          <li class="breadcrumb-item active" aria-current="page">Blog</li>
        </ol>
      </nav>
    </div>
  </div>
</section>
<section class="blogs">
  <div class="container">
    <div class="row">
      <div
        class="col-lg-6 mb-4"
        *ngFor="
          let blog of blogList
            | paginate : { itemsPerPage: 10, currentPage: p, totalItems: total }
        "
      >
        <div class="single-blog shadow-sm">
          <div class="blog-card-body">
            <!-- Render image only if it exists and is not null/undefined -->
            <div
              class="blog-image-wrapper"
              *ngIf="blog?.image && blog?.image !== 'null' && blog?.image !== 'undefined' && blog?.image.trim() !== '' && !blog?.imageFailed"
            >
              <a routerLink="/blog/{{ blog?.slug }}">
                <img
                  [defaultImage]="defaultImage"
                  [lazyLoad]="imageUrl + blog?.image"
                  (error)="blog.imageFailed = true"
                  class="img-fluid blog-img"
                  alt="{{ blog?.title }}"
                />
              </a>
            </div>
            
            <div class="blog-content-wrapper">
              <div>
                <div class="blog-card-meta mb-2">
                  <span class="date-badge">
                    <i class="far fa-calendar-alt me-1"></i>
                    {{ blog?.created | date : "dd MMM yyyy" }}
                  </span>
                  <span class="author-badge ms-3" *ngIf="blog?.authorName">
                    <i class="far fa-user me-1"></i>
                    By {{ blog?.authorName }}
                  </span>
                </div>
                <a routerLink="/blog/{{ blog?.slug }}" class="blog-title-link">
                  <h3 class="blog-title">{{ blog?.title }}</h3>
                </a>
                <p class="blog-desc">{{ blog?.shortDesc }}...</p>
              </div>
              <div class="blog-card-footer">
                <a routerLink="/blog/{{ blog?.slug }}" class="blog-readmore-btn">
                  Read More
                  <i class="fas fa-arrow-right ms-2"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col text-center mt-4">
        <pagination-controls
          (pageChange)="onTableDataChange($event)"
        ></pagination-controls>
      </div>
    </div>
  </div>
</section>
